name: Source code request
description: Request the corresponding BuildCraft source for a released JAR.
title: "[Source request] BuildCraft b70"
body:
  - type: markdown
    attributes:
      value: "Request the BuildCraft source matching your JAR release. It is provided free of charge. No email address or other personal information is required."
  - type: input
    id: release
    attributes:
      label: BuildCraft release
      description: Enter the release tag or exact JAR filename.
      value: b70
    validations:
      required: true
